[Circling]
bLegacyCircling = false ; whether to use legacy packages for circling behavior (same behavior as original papyrus mod) or use more lightweight non-package system. 
; Using legacy packages REQUIRES the WaitYourTurnRedux.esp to be present and enabled in the load order. 

bPlayerOnly = true ; if this is false, circling applies to ALL NPCs
bIncludeFollowers = false ; allows followers to benefit from the circling system alongside the player
bIncludeRangedMagic = false ; whether ranged/magic NPCs are included in circling
bTransformProtection = true ; stop attackers during werewolf/vamp lord transformation.
bKillmoveProtection = true ; prevents killmoves on actors that are currently being circled.
bProjectileSlowdown = true; slow projectiles when within a set distance of the player.
bDebugDisplay = false ; highlight attacking actors in white (for debugging)
iMaxAttackers = 2
fProjectileSlowdownRadius = 192.0 ; radius around player where projectiles are slowed
fProjectileSlowdownMultiplier = 0.1 ; multiplier applied to projectile speed within the slowdown radius
fMinFollowUpSeconds = 12.0 ; minimum seconds an enemy stays in the active attacker role (not circling) before cycling back.
fMaxFollowUpSeconds = 20.0 ; maximum seconds an enemy stays in the active attacker role (not circling) before cycling back.
fMinDefenseSeconds = 3.0 ; minimum seconds an attacked enemy stays unlocked from circling as a window of retaliation.
fMaxDefenseSeconds = 6.0 ; maximum seconds an attacked enemy stays unlocked from circling as a window of retaliation.

[Debug]
; How much detail goes into Documents\My Games\Skyrim Special Edition\SKSE\WaitYourTurn.log:
; 0 = trace, 1 = debug, 2 = info, 3 = warning, 4 = error, 5 = critical, 6 = off.
; Must be the number alone with no trailing comment on this line - anything after it makes the
; value unreadable and it silently falls back to 0.
; Ships at 0 on purpose - a bug report is far easier to diagnose when the log already has
; everything in it, so leave it alone unless the log file size is actually a problem.
uLogLevel = 0
